name: Store reference data
on:
  push:
    branches: [codex/latest-stable-2026-11-01]
    paths:
      - scripts/bundle_data.py
      - .github/workflows/store-data.yml
permissions:
  contents: read
jobs:
  store:
    if: github.repository_owner == 'Ashik-Mohammed-S' && github.ref == 'refs/heads/codex/latest-stable-2026-11-01'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: codex/latest-stable-2026-11-01
          persist-credentials: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - run: python scripts/bundle_data.py --commit
