name: Review Compass health monitor

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/health-monitor.yml'
      - '.github/workflows/failure-email.yml'
      - 'scripts/monitor_health.py'
      - 'scripts/send_failure_email.py'
      - 'tests/test_monitoring.py'

permissions:
  contents: read

concurrency:
  group: health-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements-web.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/monitor_health.py
